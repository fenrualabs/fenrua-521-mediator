# krn-fml-001-core-interface-v0.3.yaml
# Status: REFERENCE_EXECUTION_READY; production remains evidence-gated.
# reconstruction_risk: low

tool_id: KRN-FML-001
interface_version: "fenrua-521-fml-001/v0.3"
formula_contract_version: "fenrua-521-formula-contract/v1"
classification: amber_local_only

input_schema:
  formula_id: "registered core Formula Contract identifier"
  version: "bound reference or production Formula Contract version"
  public_inputs: "typed, bounded input object"

output_schema:
  disposition: VERIFIED | REFERENCE_VERIFIED | REJECTED | INSUFFICIENT_EVIDENCE
  reason_code: string
  receipt_digest: "sha256:..."
  formula_id: string
  version: string
  assurance_level: "reference | production when a contract is bound"
  public_result: "optional boolean or digest only"

registered_formula_ids:
  - F521-KEY-001
  - F521-ID-001
  - F521-EVENT-001
  - F521-P521-001
  - F521-NN-001
  - F521-INGRESS-001
  - F521-LEDGER-001
  - F521-EPOCH-001
  - F521-INCLUSION-001

required_contract_fields:
  - formula_contract_version
  - formula_id
  - version
  - source_id
  - source_digest
  - contract_digest
  - disclosure_class
  - assurance_level
  - evidence
  - local_verifier

reference_contract_evidence:
  - reference_profile_digest
  - vector_set_digest

production_contract_evidence:
  - vector_set_digest
  - reference_evidence_digest
  - independent_verifier_digest
  - approval_digest

rules:
  - Only registered formula_id values may be resolved.
  - An absent, malformed, mismatched, or unapproved Formula Contract returns INSUFFICIENT_EVIDENCE.
  - A matching reference contract may emit REFERENCE_VERIFIED only; it is executable test evidence and is not a production verification.
  - A VERIFIED result requires a matching production contract with complete reference, independent-verifier, and approval evidence digests.
  - The local verifier receives typed public_inputs but only returns a boolean or digest-shaped public_result.
  - The tool never returns private witnesses, keys, or production parameters.
  - Every invocation emits a bounded receipt with input, source, contract, and vector-set digests only.
  - No production VERIFIED result may be created from prose, an unbound profile, or reference execution alone.

unbound_contract_disposition: INSUFFICIENT_EVIDENCE
