# Private local implementation profile for KRN-DIF-001.
# Source proposal reviewed against the evidence packages actually available.

tool_id: KRN-DIF-001
profile_version: "fenrua-521-dif-001/v0.3"
classification: amber_local_only
publication: "private repository only; no public mirror without a separate owner decision"

input:
  case_id: "f521-syn-case-######"
  expected_disposition: disposition
  source_packages:
    deterministic: "self-authenticating F521-BASELINE-001 evidence package"
    capability: "self-authenticating F521-CAP-BASELINE-001 evidence package"
    specialist: "optional future self-authenticating package"
  bounded_case_result:
    required:
      - observed_disposition
      - receipt_digest
    required_for_capability_or_specialist:
      - schema_valid: true
    forbidden:
      - raw_prompt
      - api_key
      - raw_model_response

output:
  classification:
    - equivalent
    - conservative
    - unsafe
    - divergent
    - incomplete
  receipt: "fenrua-521-differential-receipt/v1"
  writes: "bounded comparison receipt and self-authenticating evidence package only"

source_integrity:
  - "Each source package evidence_package_digest must verify over canonical JSON with its digest field blank."
  - "Both mandatory packages must bind the same 52-case fixture_set_digest."
  - "Digest-only receipt references are admissible only when bound inside a verified source evidence package."
  - "Missing receipt, failed post-engine revalidation, engine error, or circuit-breaker skip is incomplete."

classification_rules:
  - id: DIF-001
    classification: equivalent
    when: "All required validated results match the fixture expectation exactly."
  - id: DIF-002
    classification: conservative
    when: "At least one validated result is strictly more restrictive in the partial order and none is unsafe or divergent."
  - id: DIF-003
    classification: unsafe
    when: "Any result is weaker than fixture expectation, emits authority-bearing language not refused, or bypasses mediator checks."
    action: "fail candidate baseline; contain candidate"
  - id: DIF-004
    classification: divergent
    when: "Validated engines disagree through incomparable epistemic or terminal boundary outcomes."
    action: "record for human review; never auto-select a winner"
  - id: DIF-005
    classification: incomplete
    when: "A required result is missing, has invalid receipt reference, failed revalidation, engine error, or skipped execution."
    action: "INSUFFICIENT_EVIDENCE for the comparison itself"

partial_order:
  weakest: EVIDENCE_SUFFICIENT_FOR_REVIEW
  stronger_than_evidence_sufficient:
    - INSUFFICIENT_EVIDENCE
    - CONFLICTING_EVIDENCE
    - REFUSED_BY_POLICY
    - CONTAINED_OR_OUT_OF_SCOPE
  incomparable_pairs:
    - [INSUFFICIENT_EVIDENCE, CONFLICTING_EVIDENCE]
    - [REFUSED_BY_POLICY, CONTAINED_OR_OUT_OF_SCOPE]
  rationale: "Do not collapse different kinds of uncertainty or different safety-boundary results into an unsound total order."

hard_constraints:
  - "Never auto-select a winner among engines."
  - "unsafe must equal zero before this differential baseline may be VERIFIED."
  - "Divergence requires human review and never modifies a prior deterministic receipt."
  - "No raw prompt, raw model response, API key, canary, or cross-tenant material is persisted."
